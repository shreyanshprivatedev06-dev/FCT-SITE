<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence pack | FCT</title>
<script>window.__fctErr=[];addEventListener("error",function(e){__fctErr.push(e.message||("Could not load "+((e.target&&(e.target.src||e.target.href))||"a file")));},true);</script>
<script src="../../assets/js/load.js"></script>
<script src="../../assets/js/p2p/load-p2p.js"></script>
<script src="../../assets/js/cmp/cmp-preview.js"></script>
</head>
<body class="px-full" data-page="cmp/audit" data-root="../../">
<script>try{ if((localStorage.getItem("fct-p2p-theme")||"dark")==="light") document.body.classList.add("theme-light"); }catch(e){}</script>
<div id="app"><p style="padding:24px">Loading Evidence pack…</p></div>
<script>
/* DESIGN PREVIEW of Compliance step 5: Evidence pack, "Can we prove it?" */
(function(){
  const P = P2P, html = P.html, R = P.R, COL = P.COL, FCT = window.FCT, C = CMPV, D = C.D, { pc } = C;
  const A = D.evAreas.map(([a,req,on])=> ({ a, req, on, miss:req-on, rate:on/req*100 }));
  const checks = [['Evidence on file at 99% or more', true, '99.23%, 42 items missing'], ['Every control owner has signed off', false, '6 attestations outstanding'],
    ['Evidence in the review scope is on file', false, 'Apex call-back log missing (CTL-P2P-009)'], ['Evidence packs ready', false, '1 of 4 ready'], ['Compliance health at 90 or more', false, '85.5']];
  /* missing evidence: the area chart filters the item list; attestations get demo actions */
  const ITEMS = Object.keys(D.evDetail).flatMap(a=> D.evDetail[a].map(([it,n,o])=> ({ a, it, n, o }))).sort((x,y)=> y.n-x.n);
  const toast = (m)=> FCT.ui && FCT.ui.toast? FCT.ui.toast(m) : null;
  const MissingSec = ()=>{ const [area, setArea] = React.useState(null), rows = ITEMS.filter(x=> !area || x.a===area), tot = rows.reduce((t,x)=> t+x.n, 0);
    return html`<${C.Sec} c="ctl" icon="Layers" title="Missing evidence" sub="42 items due 09-Oct, ahead of the 12-Oct review. Amber = below the 99% target.">
      <div class="px-brow">
      <${C.Card} k="k-blue" icon="Layers" title="Missing items by area">
        <${P.ChartBox} height=${220} label="Missing evidence items by area" table=${P.mini(['Area','Missing','On file %'], A.map(x=>[x.a, x.miss, pc(x.rate,2)]))}>
          <${R.BarChart} layout="vertical" data=${A} margin=${{top:4,right:40,left:0,bottom:4}}>
            <${R.CartesianGrid} horizontal=${false} stroke="var(--px-grid)"/><${R.XAxis} type="number" allowDecimals=${false} ...${C.axis}/><${R.YAxis} type="category" dataKey="a" width=${120} ...${C.axis}/>
            <${R.Tooltip} content=${({active,payload})=> active && payload && payload[0]? html`<div class="px-ctip"><b>${payload[0].payload.a}</b><div>${payload[0].payload.miss} missing · ${pc(payload[0].payload.rate,2)} on file · click to list</div></div>` : null}/>
            <${R.Bar} dataKey="miss" name="Evidence items missing" radius=${[0,3,3,0]} isAnimationActive=${false} style=${{cursor:'pointer'}} onClick=${(d)=> d && setArea(area===d.a? null : d.a)} label=${{ position:'right', fill:'var(--px-ink2)', fontSize:11 }}>${A.map((x,i)=> React.createElement(R.Cell, { key:i, fill: x.rate>=99? COL.pos : COL.high, fillOpacity: !area || area===x.a? 1 : 0.3 }))}</${R.Bar}></${R.BarChart}></${P.ChartBox}>
        <${C.Legend} items=${[['Below 99% on file', COL.high], ['At or above 99%', COL.pos]]}/></${C.Card}>
      <${C.Card} k="k-blue" icon="FileText" title=${(area? area+': ' : '')+tot+' missing item'+(tot===1? '' : 's')} right=${area && html`<button type="button" class="btn sm ghost" onClick=${()=> setArea(null)}>Show all</button>`}>
        <div class="px-tbl"><table class="t px-t dense"><thead><tr><th>Item</th><th class="r">Missing</th><th style=${{paddingLeft:'16px'}}>Owner</th><th><span class="sr">Action</span></th></tr></thead>
          <tbody>${rows.map(x=> html`<tr key=${x.it}><td style=${{whiteSpace:'normal'}}>${x.it}<div class="sub">${x.a}${C.D.evWhy[x.it]? ' · why: '+C.D.evWhy[x.it] : ''}</div></td><td class="r num">${x.n}</td><td style=${{paddingLeft:'16px'}}>${x.o}</td>
            <td class="r"><button type="button" class="btn sm" onClick=${()=> toast('Reminder sent to '+x.o+' for '+x.n+' item'+(x.n===1? '' : 's')+' (simulated)')}>Chase</button></td></tr>`)}
            <tr><td><b>Total</b></td><td class="r num"><b>${tot}</b></td><td/><td/></tr></tbody></table></div></${C.Card}>
      </div>
      <div style=${{marginTop:'16px'}}><${C.Card} k="k-blue" icon="ClipboardCheck" title="Outstanding attestations">
        <div class="px-tbl"><table class="t px-t dense"><thead><tr><th>Control</th><th>Owner</th><th>Due</th><th>Must sign with exception</th><th><span class="sr">Actions</span></th></tr></thead>
          <tbody>${D.attest.map(a=> html`<tr key=${a[0]}><td style=${{whiteSpace:'normal'}}>${a[1]}<div class="sub">${a[0]} · failed its latest test</div></td><td>${a[2]}<div class="sub">${a[4]}</div></td>
            <td style=${{whiteSpace:'nowrap'}}>${a[5]}<div class="sub" style=${{color:'var(--px-crit)'}}>${a[3]} d overdue</div></td><td style=${{whiteSpace:'normal'}}>${a[6]}</td>
            <td class="r"><button type="button" class="btn sm ghost" onClick=${()=> toast('Reminder sent to '+a[2]+' to sign '+a[0]+' (simulated)')}>Chase</button>
              <button type="button" class="btn sm" onClick=${()=> toast('Sign-off recorded for '+a[0]+': operated with exceptions, citing '+a[6]+' (simulated)')}>Sign with exception</button></td></tr>`)}</tbody></table></div>
        <${C.AI}>Each control owner confirms whether their control operated as designed in Q2 FY27 (Jul–Sep). All six controls failed their latest test, so each must be signed "operated with exceptions", citing the case or finding shown; a clean sign-off would be incorrect.</${C.AI}></${C.Card}></div></${C.Sec}>`; };
  const Board = ({ open })=> html`
    <${C.Sec} c="spend" icon="FileText" title="Can we prove it?" sub="Up to 40 samples per key control. A missing document fails the sample, even if the control worked."
      right=${html`<${C.Pill} tone="r">1 of 5 checks passed</${C.Pill}><${C.Pill} tone="a">7 days to review</${C.Pill}>`}>
      <div class="px-hero3-g" style=${{gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}}>
        <${C.RCard} k="k-blue" title="Evidence on file" icon="FileText" basis="As at 05-Oct" value="99.23%" chip=${html`<${C.Pill} tone="g">Target 99%</${C.Pill}>`}
          viz=${html`<div class="px-bullet" role="img" aria-label="Evidence 99.23% against target 99%, scale 90–100%"><i style=${{ width:'92.3%', background:'var(--px-pos)' }}/><b style=${{ left:'90%' }} title="Target 99%"/></div>
            <div class="sub" style=${{display:'flex', justifyContent:'space-between', fontSize:'11px'}}><span>90%</span><span>Target 99%</span><span>100%</span></div>`}
          note="5,439 of 5,481 required items are on file. Each item is the source document behind a sampled transaction." foot=${[['Required', '5,481'], ['On file', '5,439'], ['Missing', '42', 'a']]}/>
        <${C.RCard} k="k-blue" title="Attestations signed" icon="ClipboardCheck" basis="Q2 FY27" value="95%" chip=${html`<${C.Pill} tone="a">6 of 120 outstanding</${C.Pill}>`}
          viz=${html`<${C.SegBar} label="Attestations signed and outstanding" parts=${[{ l:'Signed', v:114, c:COL.pos }, { l:'Outstanding', v:6, c:COL.crit }]}/>`}
          note="Each control owner signs that their control worked this quarter. 6 of 120 have not signed; the oldest is 6 days overdue." foot=${[['Required', '120'], ['Signed', '114'], ['Overdue', '6', 'r']]}/>
        <${C.RCard} k="k-blue" title="Evidence packs ready" icon="ClipboardCheck" basis="As at 05-Oct" value="1 of 4" tone="crit" chip=${html`<${C.Pill} tone="r">3 of 4 pending</${C.Pill}>`}
          viz=${html`<${C.SegBar} label="Evidence packs" parts=${[{ l:'Ready', v:1, c:COL.pos }, { l:'Pending', v:3, c:'var(--px-medium)' }]}/>`}
          note="Each pack answers a request the auditor already made. A pack is ready once its case is decided." foot=${[['Ready', '1'], ['Waiting on a case', '2', 'a'], ['Due 09-Oct', '1', 'a']]}/>
        <${C.RCard} k="k-amber" title="Ready for the auditor?" icon="ListChecks" basis="As at 05-Oct" value="1 of 5" tone="crit" chip=${html`<${C.Pill} tone="r">Not ready</${C.Pill}>`}
          viz=${html`<${C.SegBar} label="Checks passed" parts=${[{ l:'Passed', v:1, c:COL.pos }, { l:'Open', v:4, c:COL.crit }]}/>`}
          note="Only the evidence check passes. The other four close as attestations are signed, the Apex log is filed, two cases are decided and health reaches 90." foot=${[['Passed', '1'], ['Open', '4', 'r'], ['Review', '12-Oct']]}/>
      </div></${C.Sec}>
    <${MissingSec}/>
    <${C.Sec} c="exc" icon="ClipboardCheck" title="Evidence packs for the auditor" sub="Ready once its case is decided or its documents are submitted; ready packs go to the auditor.">
      <section class="px-kc px-exc"><div class="px-tbl"><table class="t px-t dense"><thead><tr><th>Pack</th><th>Contents</th><th>Process</th><th>Status</th><th></th></tr></thead>
        <tbody>${D.packs.map(p=> html`<tr key=${p[0]} class="sel" onClick=${()=> open({ kind:'Evidence pack', label:p[0], p })}><td>${p[1]}<div class="sub">${p[0]}</div></td><td>${p[2]}</td><td>${p[3]}</td>
          <td>${p[4]==='Ready'? html`<${C.Pill} tone="g">Ready</${C.Pill}>` : html`<${C.Pill} tone="a">Pending</${C.Pill}>`}</td><td class="r">${p[5]? C.decide(p[5]) : p[4]==='Ready'? html`<button type="button" class="btn sm" onClick=${(e)=>{ e.stopPropagation(); toast(p[0]+' exported for the auditor (simulated)'); }}>Export</button>`
            : html`<button type="button" class="btn sm ghost" onClick=${(e)=>{ e.stopPropagation(); toast('Reminder sent to the '+p[3]+' team to submit '+p[2]+' by 09-Oct (simulated)'); }}>Chase</button>`}</td></tr>`)}</tbody></table></div></section>
      <section class="px-kc"><div class="px-kc-h"><span class="px-kc-t static"><span class="px-kc-i"><${P.Icon} n="ListChecks" size=${15}/></span><span>Ready for the auditor? 1 of 5 checks passed</span></span></div>
        <div role="list" aria-label="Five checks before the auditor's review" style=${{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(120px, 1fr))', gap:'10px', position:'relative', padding:'8px 0 4px'}}>
          ${checks.map(([l,ok,v])=> html`<div key=${l} role="listitem" title=${l+': '+v} style=${{display:'flex', flexDirection:'column', alignItems:'center', textAlign:'center', gap:'6px', padding:'10px 8px', borderRadius:'8px',
              border:'1px solid '+(ok? 'var(--px-pos)' : 'var(--px-crit)'), background:'color-mix(in srgb, '+(ok? 'var(--px-pos)' : 'var(--px-crit)')+' 10%, transparent)'}}>
            <span aria-hidden="true" style=${{width:'30px', height:'30px', borderRadius:'50%', display:'grid', placeItems:'center', fontWeight:700, color:'#fff', background: ok? 'var(--px-pos)' : 'var(--px-crit)'}}>${ok? '✓' : '✗'}</span>
            <span class="sub">${ok? 'Passed' : 'Open'}</span><b style=${{fontSize:'12px', lineHeight:1.3}}>${l}</b><span class="sub">${v}</span></div>`)}
          <div role="listitem" style=${{display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', textAlign:'center', gap:'6px', padding:'10px 8px', borderRadius:'8px', border:'1px dashed var(--px-ink2)'}}>
            <${P.Icon} n="CalendarClock" size=${22}/><b style=${{fontSize:'12px'}}>Auditor review</b><span class="sub">12-Oct · 7 days</span></div></div>
        <${C.AI}>Not ready yet: 4 checks are still open. Compliance health shows the path to 90.</${C.AI}><a class="btn sm" href="executive.html">Back to Compliance health</a></section></${C.Sec}>
    `;
  const Detail = ({ path })=>{ const p = path[0].p;
    return html`<${C.Sec} c="spend" icon="ClipboardCheck" title=${p[1]} sub=${p[0]+' · '+p[3]} right=${html`${p[4]==='Ready'? html`<${C.Pill} tone="g">Ready</${C.Pill}>` : html`<${C.Pill} tone="a">Pending</${C.Pill}>`}${C.decide(p[5])}`}><div class="px-brow">
      ${(()=>{ const pi = D.packInfo[p[0]] || { items:[] }; return html`<${C.Card} k="k-blue" icon="Info" title="Why the auditor asked">
        <div class="px-tbl"><table class="t px-t dense"><tbody>${[['Requested by', pi.req], ['What is tested', pi.why], ['Process', p[3]], ['Owner', pi.owner], [p[4]==='Ready'? 'Status' : 'Due', p[4]==='Ready'? pi.due : pi.due], ['Linked case', p[5]||'—']].map(([k,v])=> html`<tr key=${k}><td style=${{whiteSpace:'nowrap'}}>${k}</td><td style=${{whiteSpace:'normal'}}>${v}</td></tr>`)}</tbody></table></div></${C.Card}>
      <${C.Card} k="k-blue" icon="ListChecks" title="What is in the pack"><div class="px-tbl"><table class="t px-t dense"><thead><tr><th>Item</th><th>Status</th></tr></thead><tbody>${pi.items.map((x,i)=> html`<tr key=${i}><td style=${{whiteSpace:'normal'}}>${x[0]}</td>
          <td style=${{whiteSpace:'normal'}}>${/^On file/.test(x[1])? html`<${C.Pill} tone="g">${x[1]}</${C.Pill}>` : html`<span class="px-pill t-a" style=${{whiteSpace:'normal'}}>${x[1]}</span>`}</td></tr>`)}</tbody></table></div>
        ${pi.blocker && html`<${C.AI}>Blocking: ${pi.blocker}</${C.AI}>`}</${C.Card}>`; })()}
      <${C.Card} k="k-blue" icon="Check" title="How it becomes ready"><${C.AI}>${p[4]==='Ready'? 'Ready: export it for the auditor.' : p[5]? 'Decide case '+p[5]+'. Taking the recommendation (or overriding with a reason) files the decision trail here and the pack turns Ready.' : 'IN-03 uploads the 19 missing goods-receipt scans and IN-04 attaches the 8 missing payment advices by 09-Oct (owner Vikram Shah); the pack then turns Ready with all 125 sets.'}</${C.AI}></${C.Card}></div></${C.Sec}>`; };
  C.page({ tab:'story', step:'5', accent:'k-blue', root:{ kind:'Compliance', label:'Evidence pack', icon:'FileText' }, Board, Detail });
})();
</script>
</body>
</html>
