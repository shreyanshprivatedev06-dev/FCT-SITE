<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI tree | FCT</title>
<meta name="description" content="Tower to segment to KPI to process stage to root cause to decision, across the FCT process towers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<script>
/* Node-only colour palettes. Background is controlled separately below. */
window.__NODE_PALETTES = {
 semantic: {
  name: 'Control Tower',
  kpi: '#24406E',
  principle: '#5A3E9E',
  entity: '#0B6B73',
  fn: '#8A5300',
  cause: '#A4231C',
  pastel: {
    kpi: '#24406E',
    principle: '#5A3E9E',
    entity: '#0B6B73',
    fn: '#8A5300',
    cause: '#A4231C'
  }
}
};
window.__BG_THEMES={
  light:{name:'White',css:{
    void:'#FFFFFF',deep:'#FFFFFF',panel:'#FFFFFF',rule:'#DCE1E8',rule2:'#DCE1E8',
    text:'#121A2B',text2:'#121A2B',text3:'#5B6576',amber:'#24406E',rose:'#A4231C',
    violet:'#5A3E9E',green:'#0B6B73',ice:'#24406E',teal:'#0B6B73',grey:'#5B6576',
    ledgerPaper:'#121A2B',ledgerOxide:'#121A2B',ledgerSlate:'#121A2B',ledgerMarg:'#5B6576',
    ledgerRule:'#DCE1E8',agentPastel:'#5A3E9E'
  }}
};
window.__ACTIVE_NODE='semantic';
window.__ACTIVE_BG='light';
window.__NODE=window.__NODE_PALETTES.semantic;
window.__BG=window.__BG_THEMES.light;
window.__THEME={
  name:window.__NODE.name,
  kpi:window.__NODE.kpi, principle:window.__NODE.principle, entity:window.__NODE.entity,
  fn:window.__NODE.fn, cause:window.__NODE.cause, pastel:window.__NODE.pastel,
  css:window.__BG.css
};
</script>
<style>/* ══ THE ESTATE ═══════════════════════════════════════════════════════════
   An instrument for exploring the S.C.A.L.A knowledge base.
   Single visual world, deliberately: this is a dark screen you look *into*,
   not a document that adapts to your OS. Colour is encoding, never mood. */

:root{
  --void:#000000;          /* ground */
  --deep:#000000;
  --panel:#000000;
  --rule:#333333;
  --rule-2:#555555;
  --text:#ffffff;
  --text-2:#ffffff;
  --text-3:#ffffff;

  --amber:#ffffff;         /* the money spine: steps, forms, tracks */
  --rose:#e2557b;          /* authority: DoA, PRG, CER, the gates */
  --violet:#a98be8;        /* the agent estate */
  --green:#06D6A0;         /* people */
  --ice:#4CC9F0;           /* systems */
  --teal:#06D6A0;          /* SAP objects */
  --grey:#ffffff;          /* screens */

  /* the ladder — Engineering Ledger, direction B of the moodboard.
     A second encoding on a second axis: immutability, not kind. Ledger
     values lifted off the paper so they hold on the dark ground. */
  --ledger-paper:#ffffff;  /* rank 1 · Principles — immutable */
  --ledger-oxide:#ffffff;  /* rank 2 · SOP — formal revision only */
  --ledger-slate:#ffffff;  /* rank 3 · Suggestions — advisory */
  --ledger-marg:#ffffff;   /* rank 4 · Conventions — freely changed */
  --ledger-rule:#333333;

  /* the pastel set — see graph-data.js. Used by the force-directed reading,
     where the saturated encoding above reads as noise in constant motion. */
  --agent-pastel:#cbbaf0;

  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --disp:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--void); color:var(--text);
  font-family:var(--body); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--amber);outline-offset:2px}

/* micro-label: the one type gesture the whole instrument is built on */
.ml{
  font:400 9.5px/1 var(--mono); letter-spacing:.19em; text-transform:uppercase;
  color:var(--text-3);
}

/* ── stage ───────────────────────────────────────────────────────────── */
#stage{position:fixed;inset:0}
#c{display:block;width:100%;height:100%;cursor:grab}
#c.grabbing{cursor:grabbing}
#c.on-node{cursor:pointer}
.fixed-graph #c,.fixed-graph #c.grabbing{cursor:default}
.fixed-graph #c.on-node{cursor:pointer}

/* ── HUD chrome: corner brackets, no borders-all-round ───────────────── */
.hud{ position:fixed; background:rgba(0,0,0,.82); backdrop-filter:blur(9px); }
.hud::before,.hud::after{
  content:""; position:absolute; width:9px; height:9px; pointer-events:none;
  border:1px solid var(--rule-2);
}
.hud::before{ top:-1px; left:-1px; border-right:0; border-bottom:0 }
.hud::after{ bottom:-1px; right:-1px; border-left:0; border-top:0 }

/* titleblock */
.title{ top:20px; left:20px; padding:15px 18px 14px; max-width:290px; }
.title h1{
  margin:0; font:700 15px/1 var(--disp); letter-spacing:.26em; text-transform:uppercase;
}
.title h1 b{ color:var(--amber); font-weight:700 }
.title p{ margin:9px 0 0; font:400 11px/1.6 var(--mono); color:var(--text-3);
          letter-spacing:.04em; }
.title .counts{ margin-top:11px; display:flex; gap:14px; }
.title .counts span{ font:400 10px/1 var(--mono); letter-spacing:.1em; color:var(--text-3) }
.title .counts b{ color:var(--text-2); font-weight:400 }

/* legend / filters — the legend does real work: every row is a switch */
.legend{ top:20px; right:20px; width:216px; padding:14px 0 8px; }
.legend .ml{ padding:0 16px 10px; display:block; border-bottom:1px solid var(--rule) }
.lrow{
  display:flex; align-items:center; gap:10px; width:100%; padding:7px 16px;
  text-align:left; border-bottom:1px solid var(--rule);
}
.lrow:hover{ background:rgba(255,255,255,.03) }
.lrow .dot{ width:9px; height:9px; border-radius:50%; flex:none; box-shadow:0 0 7px currentColor }
.lrow .nm{ font:400 11.5px/1 var(--disp); letter-spacing:.04em; flex:1; color:var(--text-2) }
.lrow .ct{ font:400 10px/1 var(--mono); color:var(--text-3); font-variant-numeric:tabular-nums }
.lrow[aria-pressed="false"]{ opacity:.34 }
.lrow[aria-pressed="false"] .dot{ box-shadow:none; background:transparent!important;
  border:1px solid currentColor }

.legend .states{ padding:12px 16px 4px; display:flex; flex-direction:column; gap:8px }
.legend .states div{ display:flex; align-items:center; gap:9px;
  font:400 10px/1.3 var(--mono); letter-spacing:.06em; color:var(--text-3) }
.legend .states i{ width:9px; height:9px; border-radius:50%; flex:none }
.st-in{ background:var(--text-2) }
.st-ctx{ border:1px solid var(--text-3) }
.st-gap{ border:1px dashed var(--rose) }



/* ══ GLASS ════════════════════════════════════════════════════════════════
   Scoped to body.glass — the layered force-directed reading only. Everywhere
   else the HUD is a hard-edged instrument panel with corner brackets; here it
   is glass sitting over a lit field, because the picture underneath is soft,
   pastel and always moving. Frost needs something coloured behind it to
   refract, so the stage carries a field of slow pastel light. */
.glass #stage::before{
  content:""; position:absolute; inset:-12%; pointer-events:none;
  background:
    radial-gradient(38vw 38vw at 22% 24%, rgba(203,186,240,.15), transparent 62%),
    radial-gradient(34vw 34vw at 78% 30%, rgba(177,218,239,.13), transparent 62%),
    radial-gradient(40vw 40vw at 62% 82%, rgba(171,226,192,.10), transparent 62%),
    radial-gradient(30vw 30vw at 16% 78%, rgba(242,203,161,.10), transparent 62%);
  filter:blur(26px);
}

.glass .hud,
.glass .switch,
.glass .pal-box,
.glass .reader{
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(26px) saturate(1.5);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);
  border:1px solid rgba(255,255,255,.10);
  border-radius:16px;
  box-shadow:0 10px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.13);
}
/* the corner brackets belong to the hard-edged pages, not to glass */
.glass .hud::before, .glass .hud::after{ content:none }

.glass .reader{ border-radius:22px 0 0 22px; border-right:0 }
.glass .switch{ overflow:hidden }
.glass .switch a[aria-current="page"]{ background:rgba(255,255,255,.10) }
.glass .controls{ overflow:hidden }
.glass .lrow:last-child, .glass .trow:last-child, .glass .frow:last-child{ border-bottom:0 }
.glass .legend .ml, .glass .ladder .ml, .glass .forces .ml,
.glass .lrow, .glass .trow, .glass .frow{ border-color:rgba(255,255,255,.07) }
.glass .controls > *{ border-color:rgba(255,255,255,.07) }
.glass .rd-head{ border-bottom-color:rgba(255,255,255,.09) }
@media (prefers-reduced-transparency:reduce){
  .glass .hud, .glass .switch, .glass .pal-box, .glass .reader{
    background:rgba(0,0,0,.93); backdrop-filter:none; -webkit-backdrop-filter:none;
  }
  .glass #stage::before{ display:none }
}

/* ── forces panel (Web) ──────────────────────────────────────────────────
   The constants of the layout, exposed rather than hidden. Sits under the
   ladder in the left column. */
.forces{ top:474px; left:20px; width:262px; padding:13px 0 11px;
         max-height:calc(100vh - 548px); overflow:auto; }
.forces .ml{ padding:0 14px 9px; display:block; border-bottom:1px solid var(--rule) }
.frow{ display:grid; grid-template-columns:72px 1fr 36px; align-items:center;
       gap:9px; padding:6px 14px; border-bottom:1px solid var(--rule); cursor:pointer }
.frow span{ font:400 10.5px/1.2 var(--disp); letter-spacing:.03em; color:var(--text-2) }
.frow output{ font:400 9.5px/1 var(--mono); color:var(--text-3); text-align:right;
              font-variant-numeric:tabular-nums }
.frow input[type=range]{ width:100%; accent-color:var(--agent-pastel) }
.forces .act{ margin:9px 14px 0; padding:7px 9px; width:calc(100% - 28px);
              border:1px solid var(--rule-2); text-align:center }
@media (max-height:700px){ .forces{ display:none } }

/* ══ COSMOS ═══════════════════════════════════════════════════════════════
   Scoped to body.cosmos, which also carries .glass — the frosted HUD is
   right for this one too, but the field behind it is not a pastel daylight
   wash. It is deep space: a cold ground, two or three slow clouds of gas at
   the edges of the visible, and nothing bright enough to compete with the
   galaxies drawn on the canvas above it. Everything here is CSS on purpose —
   it sits *behind* the transparent canvas, so it costs nothing per frame. */
.cosmos{ background:#000000 }
.cosmos #stage::before{
  content:""; position:absolute; inset:-20%; pointer-events:none;
  background:
    radial-gradient(46vw 46vw at 16% 12%, rgba(126,106,208,.30), transparent 64%),
    radial-gradient(40vw 40vw at 86% 26%, rgba(60,132,182,.26), transparent 64%),
    radial-gradient(52vw 52vw at 64% 74%, rgba(162,88,158,.23), transparent 66%),
    radial-gradient(38vw 38vw at 10% 88%, rgba(54,142,152,.20), transparent 64%),
    radial-gradient(70vw 70vw at 50% 50%, rgba(18,22,50,.55), transparent 72%);
  filter:blur(44px);
}
/* the deep vignette — the field has to fall off at the edges or the whole
   page reads as a poster rather than as a plate */
.cosmos #stage::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(120% 88% at 50% 46%, transparent 42%, rgba(0,0,0,.72) 100%);
}
.cosmos .hud, .cosmos .switch, .cosmos .pal-box, .cosmos .reader{
  background:rgba(0,0,0,.85);
  border-color:rgba(255,255,255,.12);
  box-shadow:0 12px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14);
}
.cosmos .switch a[aria-current="page"]{ color:#ffffff; background:rgba(255,255,255,.10) }
.cosmos .frow input[type=range]{ accent-color:#b9c6ff }

/* the galaxies panel — the constants of the field, and a way in to each one */
.galaxies{ top:414px; left:20px; width:262px; padding:12px 0 10px;
           max-height:calc(100vh - 488px); overflow:auto; }
.galaxies .ml{ padding:0 14px 8px; display:block; border-bottom:1px solid var(--rule) }
.galaxies .frow{ padding:5px 14px }
.galaxies .act{ margin:8px 14px 0; padding:7px 9px; width:calc(100% - 28px);
                border:1px solid var(--rule-2); text-align:center }
.gjumps{ padding:8px 14px 3px; display:flex; flex-direction:column; gap:4px }
.gjump{
  display:flex; align-items:center; gap:9px; width:100%; padding:5px 8px;
  border:1px solid transparent; border-radius:9px; text-align:left;
  background:linear-gradient(90deg, color-mix(in srgb, var(--gc) 13%, transparent), transparent 86%);
}
.gjump:hover{ border-color:color-mix(in srgb, var(--gc) 42%, transparent) }
.gjump .gk{ width:15px; height:15px; flex:none; border-radius:50%;
            font:400 9px/15px var(--mono); text-align:center; color:#000000;
            background:var(--gc); box-shadow:0 0 11px color-mix(in srgb, var(--gc) 62%, transparent) }
.gjump .gn{ flex:1; font:400 11px/1.25 var(--disp); letter-spacing:.02em; color:var(--text-2);
            overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.gjump .gc{ font:400 9.5px/1 var(--mono); color:var(--text-3); font-variant-numeric:tabular-nums }
@media (max-height:760px){ .galaxies{ display:none } }

/* ══ PLATE ════════════════════════════════════════════════════════════════
   Scoped to body.plate. The one page that is not an instrument looking into
   a dark room — it is a print. So: a true black ground with a single cold
   light falling from the top right, hairline rules everywhere, and chrome
   pulled down almost to nothing so that the only thing with any ink in it is
   the plate itself. */
.plate{ background:#000000 }
.plate #stage::before{
  content:""; position:absolute; inset:0; pointer-events:none;
  background:
    radial-gradient(72vw 52vw at 88% -6%, rgba(255,255,255,.075), transparent 62%),
    radial-gradient(60vw 60vw at 12% 104%, rgba(255,255,255,.045), transparent 60%);
}
.plate .hud, .plate .switch, .plate .pal-box{
  background:rgba(0,0,0,.80); backdrop-filter:blur(7px);
  border-color:rgba(255,255,255,.11);
}
.plate .hud::before, .plate .hud::after{ border-color:rgba(255,255,255,.24) }
.plate .reader{ background:#000000; border-left-color:rgba(255,255,255,.14) }
.plate .switch a[aria-current="page"]{ color:#ffffff; background:rgba(255,255,255,.09) }
.plate .lrow, .plate .trow, .plate .frow, .plate .controls > *,
.plate .legend .ml, .plate .ladder .ml, .plate .forces .ml{
  border-color:rgba(255,255,255,.08);
}
.plate .seg button[aria-pressed="true"]{ color:#ffffff; background:rgba(255,255,255,.09) }

/* the plate's own control block — same furniture as the forces panel */
.plate .forces{ top:414px; max-height:calc(100vh - 488px) }
.plate .forces .seg{ margin:0 0 4px; border-bottom:1px solid rgba(255,255,255,.08) }
.plate .forces .seg button{ flex:1; padding:9px 6px; letter-spacing:.12em }
.plate .frow input[type=range]{ accent-color:#e2557b }

/* the stratum band in the reader — set as marginalia on ledger paper */
.rd-tier{
  margin-top:16px; padding:11px 13px 12px; border-left:2px solid var(--tc);
  background:linear-gradient(90deg, color-mix(in srgb, var(--tc) 11%, transparent), transparent 78%);
}
.rd-tier .tk{ font:400 9.5px/1 var(--mono); letter-spacing:.19em;
              text-transform:uppercase; color:var(--tc) }
.rd-tier .tn{ display:block; margin-top:7px; font:400 14px/1.2 var(--disp);
              letter-spacing:.01em; color:var(--ledger-paper) }
.rd-tier .te{ display:inline-block; margin-top:7px; padding:3px 7px;
              border:1px solid var(--tc); font:400 9px/1 var(--mono);
              letter-spacing:.15em; text-transform:uppercase; color:var(--tc) }
.rd-tier .tr{ margin:9px 0 0; font:400 11.5px/1.55 var(--mono);
              letter-spacing:.02em; color:var(--ledger-marg) }

.readout .rt{ margin-top:6px; font:400 9.5px/1.4 var(--mono); letter-spacing:.15em }

/* control bar */
.controls{ bottom:20px; left:20px; display:flex; align-items:stretch; }
.controls > *{ border-right:1px solid var(--rule) }
.controls > *:last-child{ border-right:0 }
.seg{ display:flex }
.seg button{ padding:11px 15px; font:400 10px/1 var(--mono); letter-spacing:.15em;
             text-transform:uppercase; color:var(--text-3) }
.seg button[aria-pressed="true"]{ color:var(--amber); background:rgba(255,255,255,.08) }
.seg button:hover{ color:var(--text) }
.depth{ display:flex; align-items:center; gap:10px; padding:0 15px }
.depth label{ font:400 9.5px/1 var(--mono); letter-spacing:.15em; text-transform:uppercase;
              color:var(--text-3) }
.depth input{ width:78px; accent-color:var(--amber) }
.depth output{ font:400 10px/1 var(--mono); color:var(--amber); width:26px }
.act{ padding:11px 15px; font:400 10px/1 var(--mono); letter-spacing:.15em;
      text-transform:uppercase; color:var(--text-3) }
.act:hover{ color:var(--text) }
.act kbd{ color:var(--rule-2); margin-left:7px }

/* readout — follows the cursor's node */
.readout{ top:12px; right:20px; width:300px; padding:8px 14px 9px; pointer-events:none; z-index:20 }
.readout .ml{ display:block; margin-bottom:4px }
.readout .rn{ font:400 14px/1.25 var(--disp); letter-spacing:.01em; color:var(--text);
              white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
.readout .rs{ margin-top:3px; font:400 10.5px/1.5 var(--mono); color:var(--text-3);
              letter-spacing:.04em }
.readout .hint{ font:400 10.5px/1.6 var(--mono); color:var(--text-3); letter-spacing:.03em }

/* variant switcher — six readings of one estate */
.switch{
  position:fixed; top:20px; left:50%; transform:translateX(-50%); display:flex;
  background:rgba(0,0,0,.82); backdrop-filter:blur(9px);
  border:1px solid var(--rule); z-index:10;
}
.switch a{
  padding:10px 17px; text-decoration:none; color:var(--text-3);
  font:400 10px/1 var(--mono); letter-spacing:.17em; text-transform:uppercase;
  border-right:1px solid var(--rule);
}
.switch a:last-child{ border-right:0 }
.switch a:hover{ color:var(--text) }
.switch a[aria-current="page"]{ color:var(--amber); background:rgba(255,255,255,.09) }

.variant-blurb{ max-width:33ch }

/* ── reader ──────────────────────────────────────────────────────────── */
.reader{
  position:fixed; top:0 ; right:0; bottom:0; width:min(560px,46vw);
  background:var(--deep); border-left:1px solid var(--rule-2);
  transform:translateX(101%); transition:transform .34s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column; z-index:20;
}
.reader.open{ transform:none }
@media (prefers-reduced-motion:reduce){ .reader{ transition:none } }
.rd-head{ padding:22px 26px 18px; border-bottom:1px solid var(--rule); flex:none }
.rd-kind{ display:flex; align-items:center; gap:9px }
.rd-kind i{ width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor }
.rd-head h2{ margin:12px 0 0; font:700 27px/1.12 var(--disp); letter-spacing:-.02em }
.rd-sub{ margin:8px 0 0; font:400 11px/1 var(--mono); letter-spacing:.13em;
         text-transform:uppercase; color:var(--text-3) }
.rd-close{ position:absolute; top:20px; right:22px; padding:6px 9px;
           font:400 10px/1 var(--mono); letter-spacing:.14em; color:var(--text-3) }
.rd-close:hover{ color:var(--text) }
.rd-body{ overflow-y:auto; padding:22px 26px 60px; flex:1 }
.rd-body p.lead{ margin:0; font:400 16px/1.62 var(--body); color:var(--text) }

.rd-sec{ margin-top:28px }
.rd-sec > .ml{ display:block; padding-bottom:9px; border-bottom:1px solid var(--rule) }
.ai-suggestion{
  --suggestion-accent:var(--ice);
  margin-top:24px; padding:16px 17px 17px;
  border:1px solid var(--rule); border-left:2px solid var(--suggestion-accent);
  background:linear-gradient(135deg, color-mix(in srgb, var(--suggestion-accent) 8%, transparent), transparent 72%);
}
.ai-suggestion-head{ display:flex; align-items:center; justify-content:space-between; gap:12px }
.ai-suggestion-label{
  font:400 9px/1 var(--mono); letter-spacing:.17em; text-transform:uppercase;
  color:var(--suggestion-accent);
}
.ai-suggestion-badge{
  padding:5px 7px; border:1px solid color-mix(in srgb, var(--suggestion-accent) 48%, transparent);
  font:400 8px/1 var(--mono); letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3);
}
.ai-suggestion h3{ margin:15px 0 0; font:600 17px/1.3 var(--disp); color:var(--text) }
.ai-suggestion p{ margin:9px 0 0; font:400 13px/1.6 var(--body); color:var(--text-2) }
.ai-suggestion ul{ margin:12px 0 0; padding:0; list-style:none }
.ai-suggestion li{ position:relative; margin-top:8px; padding-left:15px;
  font:400 12px/1.55 var(--body); color:var(--text-2) }
.ai-suggestion li::before{ content:""; position:absolute; left:1px; top:.68em;
  width:6px; height:1px; background:var(--suggestion-accent) }
.ai-suggestion-check{
  margin-top:15px!important; padding-top:11px; border-top:1px solid var(--rule);
  font-size:11px!important; color:var(--text-3)!important;
}
.ai-suggestion-check strong{
  display:block; margin-bottom:5px; font:400 8px/1 var(--mono);
  letter-spacing:.14em; text-transform:uppercase; color:var(--suggestion-accent);
}
.ai-suggestion .ai-suggestion-disclaimer{
  margin-top:11px; font:400 10px/1.5 var(--body); color:var(--text-3);
}
.link{
  display:flex; gap:11px; align-items:baseline; width:100%; text-align:left;
  padding:9px 2px; border-bottom:1px solid var(--rule);
}
.link:hover{ background:rgba(255,255,255,.03) }
.link .rel{ font:400 9.5px/1.5 var(--mono); letter-spacing:.09em; text-transform:uppercase;

<script>/* ══ EXPLORE CORE ══════════════════════════════════════════════════════════
   Shared machinery behind the variations: model, camera, input, reader,
   palette, filters. A variation supplies a spec:

     place(H)          write n.tx / n.ty (targets); core springs nodes to them
     render(ctx, H)    draw everything — the variation owns the picture
     pick(x, y, H)     optional; default is nearest node
     drag              optional 'free' | 'axis' | false      (default 'free')
     pan               optional false to disable background panning
     spring            optional false to place nodes instantly
     panToSelection    optional false to keep the camera fixed on selection
     relayoutOnSelection optional false to preserve node positions on selection
     onSelect(n, H)    optional hook

   H is the helper bag: nodes, edges, adj, S, W, H, sx, sy, wx, wy, hexA,
   tracked, clearTrack, visible, focus, alphaOf, select, byId.
─────────────────────────────────────────────────────────────────────────── */

window.Explore = function (spec) {
  'use strict';

  var D = window.GRAPH, SHEETS = window.SHEETS_HTML || {};

  /* A page may ask for an alternate palette (spec.palette:'pastel'). Resolve it
     in one place so canvas, legend, reader and search all agree. */
  function paint(rec) { return (spec.palette && rec[spec.palette]) || rec.color; }
  var RM = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var RADIUS = { kpi:9, principle:8, entity:11, fn:8, cause:7 };

  /* ── model ─────────────────────────────────────────────────────────── */
  var nodes = D.nodes.map(function (n) {
    return {
      id:n[0], label:n[1], type:n[2], ring:n[3], clock:n[4], state:n[5],
      sheet:n[6], sub:n[7], text:n[8], go:n[9] || '',
      x:0, y:0, tx:0, ty:0, vx:0, vy:0, pinned:false,
      r:RADIUS[n[2]] || 5, color:paint(D.types[n[2]]), deg:0,
      rank:(D.tier && D.tier[n[0]]) || 0,
    };
  });

  /* the ladder: rank → its stratum record, 0 = unruled */
  var TIERS = D.tiers || [];
  var tierOf = {};
  TIERS.forEach(function (t) { tierOf[t.n] = t; });
  var byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; });

  var edges = D.edges.filter(function (e) { return byId[e[0]] && byId[e[1]]; })
    .map(function (e) { return { a:byId[e[0]], b:byId[e[1]], rel:e[2] }; });

  var adj = {};
  nodes.forEach(function (n) { adj[n.id] = []; });
  edges.forEach(function (e) {
    adj[e.a.id].push({ node:e.b, rel:e.rel, out:true });
    adj[e.b.id].push({ node:e.a, rel:e.rel, out:false });
    e.a.deg++; e.b.deg++;
  });

  var S = {
    depth:0, gaps:true, on:{}, onR:{}, sel:null, hover:null, drag:null,
    cam:{ x:0, y:0, k:1 }, panning:false, t0:performance.now(), reveal:RM ? 1e5 : 0,
  };
  Object.keys(D.types).forEach(function (t) { S.on[t] = true; });
  TIERS.forEach(function (t) { S.onR[t.n] = true; });

  var KEY = 'estate:' + (spec.id || 'v');
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (typeof saved.gaps === 'boolean') S.gaps = saved.gaps;
    if (saved.on) Object.keys(saved.on).forEach(function (t) { if (t in S.on) S.on[t] = saved.on[t]; });
    if (saved.onR) Object.keys(saved.onR).forEach(function (r) { if (r in S.onR) S.onR[r] = saved.onR[r]; });
    if (saved.pins) nodes.forEach(function (n) {
      var p = saved.pins[n.id];
      if (p) { n.x = n.tx = p[0]; n.y = n.ty = p[1]; n.pinned = true; }
    });
  } catch (e) {}

  function save() {
    var pins = {};
    nodes.forEach(function (n) { if (n.pinned) pins[n.id] = [Math.round(n.x), Math.round(n.y)]; });
    try { localStorage.setItem(KEY, JSON.stringify({ gaps:S.gaps, on:S.on, onR:S.onR, pins:pins })); } catch (e) {}
  }

  /* ── visibility ────────────────────────────────────────────────────── */
  var visible = {}, focus = null, focusEdge = null;

  function hops(from, d) {
    var seen = {}, frontier = [from];
    seen[from.id] = 0;
    for (var i = 1; i <= d; i++) {
      var next = [];
      frontier.forEach(function (n) {
        adj[n.id].forEach(function (l) {
          if (!(l.node.id in seen)) { seen[l.node.id] = i; next.push(l.node); }
        });
      });
      frontier = next;
    }
    return seen;
  }

  function livePaths() { return spec.paths ? spec.paths() : (D.paths || []); }

  function recompute() {
    var scope = (S.sel && S.depth > 0) ? hops(S.sel, S.depth) : null;
    nodes.forEach(function (n) {
      visible[n.id] = S.on[n.type] && S.onR[n.rank] !== false &&
        (n.state !== 'gap' || S.gaps) && (!scope || n.id in scope) && (!spec.filter || spec.filter(n));
    });
    if (S.sel) visible[S.sel.id] = true;
    var active = S.hover || S.sel;
    if (!active) { focus = null; focusEdge = null; return; }
    focus = {}; focusEdge = {};
    focus[active.id] = 1;
    livePaths().forEach(function (p) {
      if (p.indexOf(active.id) < 0) return;
      p.forEach(function (id, i) { focus[id] = 1; if (i) focusEdge[p[i - 1] + '>' + id] = 1; });
    });
  }

  /* ── canvas ────────────────────────────────────────────────────────── */
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  var W = 0, Hh = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; Hh = cv.clientHeight;
    cv.width = W * dpr; cv.height = Hh * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    H.W = W; H.H = Hh;
    relayout();
    if (spec.spring === false) nodes.forEach(function (n) { n.x = n.tx; n.y = n.ty; });
    if (spec.frame) spec.frame(H);
  }

  // layouts read `visible`, so visibility must be resolved before placing
  function relayout() {
    recompute();
    if (spec.place) spec.place(H);
  }

  function sx(x) { return (x - S.cam.x) * S.cam.k + W / 2; }
  function sy(y) { return (y - S.cam.y) * S.cam.k + Hh / 2; }
  function wx(x) { return (x - W / 2) / S.cam.k + S.cam.x; }
  function wy(y) { return (y - Hh / 2) / S.cam.k + S.cam.y; }

  function tracked(size, sp, weight) {
    ctx.font = (weight || 400) + ' ' + size + 'px ui-monospace, "SF Mono", Menlo, monospace';
    if ('letterSpacing' in ctx) ctx.letterSpacing = sp + 'px';
  }
  function clearTrack() { if ('letterSpacing' in ctx) ctx.letterSpacing = '0px'; }
  function sans(size, weight) {
    ctx.font = (weight || 400) + ' ' + size + 'px "Helvetica Neue", Helvetica, Arial, sans-serif';
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  }

  function hexA(hex, a) {
    var v = parseInt(hex.slice(1), 16);
    return 'rgba(' + (v >> 16 & 255) + ',' + (v >> 8 & 255) + ',' + (v & 255) + ',' + a + ')';
  }

  function alphaOf(n) {
    if (!visible[n.id]) return 0;
    if (!focus) return 1;
    return focus[n.id] ? 1 : 0.12;
  }

  var H = {
    nodes:nodes, edges:edges, adj:adj, byId:byId, types:D.types, S:S, ctx:ctx,
    W:W, H:Hh, sx:sx, sy:sy, wx:wx, wy:wy, hexA:hexA, tracked:tracked,
    clearTrack:clearTrack, sans:sans, visible:visible, alphaOf:alphaOf,
    tiers:TIERS, tierOf:tierOf, paint:paint, paths:function () { return livePaths(); },
    get focus() { return focus; }, get focusEdge() { return focusEdge; },
    select:function (n) { select(n); }, save:save,
    hover:function (n) { S.hover = n; readout(n); cv.classList.toggle('on-node', !!n); },
    relayout:function () { relayout(); },
  };

  window.addEventListener('resize', resize);
  resize();

  /* ── loop ──────────────────────────────────────────────────────────── */
  function integrate() {
    if (spec.spring === false) {
      nodes.forEach(function (n) { if (n !== S.drag && !n.pinned) { n.x = n.tx; n.y = n.ty; } });
      return;
    }
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      if (n === S.drag || n.pinned) { n.vx = n.vy = 0; continue; }
      n.vx = (n.vx + (n.tx - n.x) * 0.16) * 0.68;
      n.vy = (n.vy + (n.ty - n.y) * 0.16) * 0.68;
      n.x += n.vx; n.y += n.vy;
    }
  }

  function loop() {
    if (!RM) S.reveal = Math.min(1e5, (performance.now() - S.t0) * 0.9);
    integrate();
    recompute();
    ctx.clearRect(0, 0, W, Hh);
    // A throw inside a variation's render used to kill the rAF chain and freeze
    // the whole instrument silently — no motion, no hover, no clue why.
    try { spec.render(ctx, H); }
    catch (err) { if (!loop.warned) { loop.warned = 1; console.error('render:', err); } }
    requestAnimationFrame(loop);
  }

  /* ── picking & pointer ─────────────────────────────────────────────── */
  function px(e) { return e.clientX - cv.getBoundingClientRect().left; }
  function py(e) { return e.clientY - cv.getBoundingClientRect().top; }

  function pick(x, y) {
    if (spec.pick) return spec.pick(x, y, H);
    var best = null, bd = 1e9;
    for (var i = nodes.length - 1; i >= 0; i--) {
      var n = nodes[i];
      if (!visible[n.id]) continue;
      var dx = x - sx(n.x), dy = y - sy(n.y), d2 = dx * dx + dy * dy;
      var hit = Math.max(11, n.r * S.cam.k + 6);
      if (d2 < hit * hit && d2 < bd) { bd = d2; best = n; }
    }
    return best;
  }

  var down = null, moved = false;
  var dragMode = spec.drag === undefined ? 'free' : spec.drag;

  cv.addEventListener('pointerdown', function (e) {
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    moved = false;
    var n = pick(px(e), py(e));
    down = { x:px(e), y:py(e), node:n };
    if (n && dragMode) S.drag = n;
    else if (spec.pan !== false) { S.panning = true; cv.classList.add('grabbing'); }
    retireCue();
  });

  cv.addEventListener('pointermove', function (e) {
    var x = px(e), y = py(e);
    if (down && (Math.abs(x - down.x) > 3 || Math.abs(y - down.y) > 3)) moved = true;
    if (S.drag) {
      if (dragMode === 'axis' && spec.constrain) spec.constrain(S.drag, wx(x), wy(y), H);
      else { S.drag.x = S.drag.tx = wx(x); S.drag.y = S.drag.ty = wy(y); }
      S.drag.vx = S.drag.vy = 0;
      return;
    }
    if (S.panning && down) {
      // a variation may claim the background drag — a 3-D one needs it to orbit
      if (spec.pan) spec.pan(x - down.x, y - down.y, H);
      else {
        S.cam.x -= (x - down.x) / S.cam.k;
        S.cam.y -= (y - down.y) / S.cam.k;
      }
      down.x = x; down.y = y;
      return;
    }
    var n = pick(x, y);
    if (n !== S.hover) { S.hover = n; readout(n); cv.classList.toggle('on-node', !!n); }
  });

  cv.addEventListener('pointerup', function () {
    if (S.drag) {
      if (moved) { S.drag.pinned = true; save(); }
      else select(S.drag);
      S.drag = null;
    } else if (down && !moved) {
      // no drag mode: the node never became S.drag, so the click resolves here
      select(down.node || null);
    }
    S.panning = false; down = null;
    cv.classList.remove('grabbing');
  });

  cv.addEventListener('dblclick', function (e) {
    var n = pick(px(e), py(e));
    if (n && n.pinned) { n.pinned = false; save(); }
  });

  cv.addEventListener('wheel', function (e) {
    e.preventDefault();
    if (spec.zoom === false) return;
    var b = { x:wx(px(e)), y:wy(py(e)) };
    S.cam.k = Math.max(0.24, Math.min(4, S.cam.k * Math.pow(0.999, e.deltaY * 1.4)));
    S.cam.x += b.x - wx(px(e));
    S.cam.y += b.y - wy(py(e));
    retireCue();
  }, { passive:false });

  /* ── reader ────────────────────────────────────────────────────────── */
  var reader = document.getElementById('reader');

  function select(n) {
    S.sel = n;
    if (!n) { reader.classList.remove('open'); if (spec.onSelect) spec.onSelect(null, H); return; }
    renderReader(n);
    reader.classList.add('open');
    if (S.depth > 0 && spec.relayoutOnSelection !== false) relayout();
    if (spec.onSelect) spec.onSelect(n, H);
    else if (spec.panToSelection !== false) panTo(n);
  }

  function panTo(n) {
    var panel = window.innerWidth > 900 ? Math.min(560, window.innerWidth * 0.46) : 0;
    S.cam.x = n.x + (panel / 2) / S.cam.k;
    S.cam.y = n.y;
  }
  H.panTo = panTo;

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function stateLabel(s) {
    return s === 'in' ? 'Evidenced — figure in the model'
         : s === 'ctx' ? 'Hypothesis — to validate'
         : 'Gap — not in the model';
  }
  function subtitle(n) {
    var st = stateLabel(n.state);
    if (!n.sub || st.toLowerCase().indexOf(n.sub.toLowerCase()) > -1) return st;
    return n.sub + ' · ' + st;
  }

  function tierBand(n) {
    var t = tierOf[n.rank];
    if (!t) return '';
    return '<div class="rd-tier" style="--tc:' + paint(t) + '">' +
      '<span class="tk">' + (t.n ? 'Layer ' + t.n : 'Off-ladder') + '</span>' +
      '<span class="tn">' + t.label + '</span>' +
      '<span class="te">' + t.edit + '</span>' +
      '<p class="tr">' + t.rule + '</p></div>';
  }
  H.tierBand = tierBand;

  /* the decision behind a root cause: recommended action, how to verify, and the exceptions to decide in the Executive view */
  var DECISIONS = window.GRAPH.decisions || {};
  var SEV_LABEL = { critical:'Critical', high:'High', medium:'Medium', low:'Low' };

  function suggestionCard(n) {
    if (n.type !== 'cause' || !DECISIONS[n.id]) return null;
    var d = DECISIONS[n.id];
    var card = el('section', 'ai-suggestion');
    card.setAttribute('aria-label', 'Decision');
    card.style.setProperty('--suggestion-accent', n.color);

    var head = el('div', 'ai-suggestion-head');
    head.appendChild(el('span', 'ai-suggestion-label', 'Decision'));
    head.appendChild(el('span', 'ai-suggestion-badge', n.state === 'in' ? 'Cause evidenced' : 'Owner confirms cause'));
    card.appendChild(head);

    var title = el('h3');
    title.textContent = d.title;
    card.appendChild(title);

    var summary = el('p');
    summary.textContent = d.summary;
    card.appendChild(summary);

    var actions = el('ul');
    d.actions.forEach(function (action) {
      var item = el('li');
      item.textContent = action;
      actions.appendChild(item);
    });
    card.appendChild(actions);

    var check = el('p', 'ai-suggestion-check');
    check.appendChild(el('strong', '', 'How to verify'));
    check.appendChild(document.createTextNode(d.check));
    card.appendChild(check);

    var refs = el('div', 'xv-refs');
    d.refs.forEach(function (r) {
      var a = el('a', 'xv-decide');
      a.href = 'desk.html?x=' + encodeURIComponent(r[0]);
      var top = el('span', 'xv-d-top');
      top.appendChild(el('b', '', 'Decide'));
      top.appendChild(document.createTextNode(r[0] + ' · ' + (SEV_LABEL[r[3]] || r[3]) + ' · ' + r[2]));
      a.appendChild(top);
      var t = el('span', 'xv-d-t');
      t.textContent = r[1];
      a.appendChild(t);
      refs.appendChild(a);
    });
    card.appendChild(refs);

    var disclaimer = el('p', 'ai-suggestion-disclaimer');
    disclaimer.textContent = 'Recommended action from the tower’s decision record. The accountable owner decides in the Executive view, where the evidence, the options and the audit trail are kept.';
    card.appendChild(disclaimer);
    return card;
  }

  /* every KPI → cause chain that runs through the selected node, each step clickable */
  function pathsSection(n) {
    var all = livePaths();
    var mine = all.filter(function (p) { return p.indexOf(n.id) >= 0; });
    if (!mine.length) return null;
    var sec = el('div', 'rd-sec');
    sec.appendChild(el('span', 'ml', mine.length + ' of ' + all.length + ' paths run through here'));
    mine.forEach(function (p) {
      var card = el('div', 'rd-path');
      p.forEach(function (id, i) {
        if (i) card.appendChild(el('span', 'arr', '→'));
        var m = byId[id];
        var b = el('button', 'step' + (id === n.id ? ' me' : ''));
        var d = el('span', 'dot'); d.style.background = m.color;
        b.appendChild(d);
        b.appendChild(document.createTextNode(m.label));
        b.addEventListener('click', function () { select(m); });
        card.appendChild(b);
      });
      sec.appendChild(card);
    });
    return sec;
  }

  function renderReader(n) {
    var t = D.types[n.type];
    document.getElementById('rd-head').innerHTML =
      '<div class="rd-kind" style="color:' + n.color + '"><i style="background:' + n.color + '"></i>' +
      '<span class="ml" style="color:' + n.color + '">' + t.label + '</span></div>' +
      '<h2>' + n.label + '</h2><p class="rd-sub">' + subtitle(n) + '</p>' + tierBand(n);

    var body = document.getElementById('rd-body');
    body.innerHTML = '';
    body.scrollTop = 0;
    body.appendChild(el('p', 'lead', n.text));
    if (n.go) {
      var go = el('a', 'rd-open xv-go', 'Open in ' + (n.sheet || 'the tower') + ' ↗');
      go.href = n.go;
      body.appendChild(go);
    }
    var pathSec = pathsSection(n);
    if (pathSec) body.appendChild(pathSec);
    var suggestion = suggestionCard(n);
    if (suggestion) body.appendChild(suggestion);

    var links = adj[n.id].slice().sort(function (a, b) {
      return a.node.label.localeCompare(b.node.label);
    });
    if (links.length) {
      var sec = el('div', 'rd-sec');
      sec.appendChild(el('span', 'ml', links.length === 1 ? 'Direct link' : 'Direct links'));
      links.forEach(function (l) {
        var b = el('button', 'link');
        b.innerHTML = '<span class="rel">' + (l.out ? '↓ ' : '↑ ') + l.rel + '</span>' +
          '<span class="dot" style="background:' + l.node.color + '"></span>' +
          '<span class="to">' + l.node.label + '</span>';
        b.addEventListener('click', function () { select(l.node); });
        sec.appendChild(b);
      });
      body.appendChild(sec);
    }

    if (n.sheet && SHEETS[n.sheet]) {
      var s = SHEETS[n.sheet];
      var btn = el('button', 'rd-open', 'Read ' + s.sheet + ' · ' + s.title);
      var holder = el('div', 'sheet-body');
      holder.hidden = true;
      btn.addEventListener('click', function () {
        holder.hidden = !holder.hidden;
        if (!holder.hidden && !holder.innerHTML) holder.innerHTML = s.html;
        btn.textContent = (holder.hidden ? 'Read ' : 'Hide ') + s.sheet + ' · ' + s.title;
      });
      body.appendChild(btn);
      body.appendChild(holder);
    }
  }

  document.getElementById('rd-close').addEventListener('click', function () { select(null); });

  /* ── readout ───────────────────────────────────────────────────────── */
  var ro = document.getElementById('ro-body');
  function readout(n) {
    if (!n) { ro.innerHTML = '<p class="hint">' + (spec.hint || 'Click anything to open it.') + '</p>'; return; }
    var t = tierOf[n.rank];
    ro.innerHTML = '<div class="rn">' + n.label + '</div><div class="rs">' +
      D.types[n.type].label.toUpperCase() + ' · ' + adj[n.id].length + (adj[n.id].length === 1 ? ' link' : ' links') +
      (t && t.n ? ' · <span style="color:' + paint(t) + '">LAYER ' + t.n + '</span>' : '') + '</div>';
  }
  readout(null);

  /* ── legend ────────────────────────────────────────────────────────── */
  var legend = document.getElementById('legend-rows');
  if (legend) {
    Object.keys(D.types).forEach(function (t) {
      var count = nodes.filter(function (n) { return n.type === t; }).length;
      if (!count) return;
      var b = el('button', 'lrow');
      b.dataset.t = t;
      b.setAttribute('aria-pressed', String(S.on[t]));
      b.innerHTML = '<span class="dot" style="background:' + paint(D.types[t]) + ';color:' +
        paint(D.types[t]) + '"></span><span class="nm">' + D.types[t].label +
        '</span><span class="ct">' + count + '</span>';
      b.addEventListener('click', function () {
        S.on[t] = !S.on[t];
        b.setAttribute('aria-pressed', String(S.on[t]));
        relayout();
        save();
      });
      legend.appendChild(b);
    });
  }

  /* ── layer dropdown ─────────────────────────────────────────────────── */
  var layerSelect = document.getElementById('layer-select');
  if (layerSelect) {
    var enabledTiers = TIERS.filter(function (t) { return S.onR[t.n] !== false; });
    if (enabledTiers.length === 1) {
      layerSelect.value = String(enabledTiers[0].n);
    } else {
      layerSelect.value = 'all';
      TIERS.forEach(function (t) { S.onR[t.n] = true; });
    }

    layerSelect.addEventListener('change', function () {
      var v = layerSelect.value;

      /* "All layers" restores every layer; otherwise show only the chosen layer. */
      TIERS.forEach(function (t) {
        S.onR[t.n] = (v === 'all' || String(t.n) === v);
      });

      relayout();
      save();
    });
  }

  /* ── controls ──────────────────────────────────────────────────────── */
  var depth = document.getElementById('depth'), depthOut = document.getElementById('depth-out');
  if (depth) depth.addEventListener('input', function () {
    S.depth = +depth.value;
    depthOut.textContent = S.depth === 0 ? 'all' : S.depth;
    relayout();
  });

  var gapsBtn = document.getElementById('btn-gaps');
  if (gapsBtn) {
    gapsBtn.style.color = S.gaps ? 'var(--rose)' : '';
    gapsBtn.addEventListener('click', function () {
      S.gaps = !S.gaps;
      gapsBtn.style.color = S.gaps ? 'var(--rose)' : '';
      relayout();
      save();
    });
  }

  function fit() {
    var xs = [], ys = [];
    nodes.forEach(function (n) { if (visible[n.id]) { xs.push(n.tx); ys.push(n.ty); } });
    if (!xs.length) return;
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var pad = spec.fitPad || 220;
    S.cam.x = (x0 + x1) / 2; S.cam.y = (y0 + y1) / 2;
    S.cam.k = Math.max(0.24, Math.min(2, Math.min(W / (x1 - x0 + pad), Hh / (y1 - y0 + pad))));
  }
  H.fit = fit;
  // a variation whose furniture is bigger than its nodes can frame itself
  function doFit() { if (spec.frame) spec.frame(H); else fit(); }
  H.doFit = doFit;

  var fitBtn = document.getElementById('btn-fit');
  if (fitBtn) fitBtn.addEventListener('click', doFit);
  var resetBtn = document.getElementById('btn-reset');
  if (resetBtn) resetBtn.addEventListener('click', function () {
    nodes.forEach(function (n) { n.pinned = false; });
    relayout();
    save();
  });

  /* ── palette ───────────────────────────────────────────────────────── */
  var pal = document.getElementById('palette'), pq = document.getElementById('pq');
  var presults = document.getElementById('presults'), pcur = 0, phits = [];

  function openPal() { pal.hidden = false; pq.value = ''; renderPal(''); pq.focus(); retireCue(); }
  function closePal() { pal.hidden = true; }

  function renderPal(q) {
    q = q.trim().toLowerCase();
    phits = nodes.filter(function (n) {
      return !q || (n.label + ' ' + n.sub + ' ' + n.text).toLowerCase().indexOf(q) > -1;
    }).slice(0, 40);
    pcur = 0;
    if (!phits.length) { presults.innerHTML = '<p class="pal-empty">Nothing in the estate matches that.</p>'; return; }
    presults.innerHTML = phits.map(function (n, i) {
      return '<button class="pres' + (i === 0 ? ' on' : '') + '" data-i="' + i + '">' +
        '<span class="dot" style="background:' + n.color + '"></span>' +
        '<span class="pn">' + n.label + '</span>' +
        '<span class="pt">' + D.types[n.type].label + '</span></button>';
    }).join('');
  }

  function movePal(d) {
    var els = presults.querySelectorAll('.pres');
    if (!els.length) return;
    els[pcur].classList.remove('on');
    pcur = (pcur + d + els.length) % els.length;
    els[pcur].classList.add('on');
    els[pcur].scrollIntoView({ block:'nearest' });
  }

  function reveal(n) {
    if (!n) return;
    S.on[n.type] = true;
    S.onR[n.rank] = true;
    var row = document.querySelector('.lrow[data-t="' + n.type + '"]');
    if (row) row.setAttribute('aria-pressed', 'true');
    var trow = document.querySelector('.trow[data-r="' + n.rank + '"]');
    if (trow) trow.setAttribute('aria-pressed', 'true');
    if (n.state === 'gap' && !S.gaps && gapsBtn) gapsBtn.click();
    relayout();
    select(n);
  }

  pq.addEventListener('input', function () { renderPal(pq.value); });
  presults.addEventListener('click', function (e) {
    var b = e.target.closest('.pres');
    if (b) { closePal(); reveal(phits[+b.dataset.i]); }
  });
  pal.addEventListener('mousedown', function (e) { if (e.target === pal) closePal(); });
  var searchBtn = document.getElementById('searchBtn');
  if (searchBtn) searchBtn.addEventListener('click', openPal);

  document.addEventListener('keydown', function (e) {
if (!pal.hidden) {
      if (e.key === 'Escape') closePal();
      else if (e.key === 'ArrowDown') { e.preventDefault(); movePal(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); movePal(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); closePal(); reveal(phits[pcur]); }
      return;
    }
    if (e.target.tagName === 'INPUT') return;
    if (e.key === '/') { e.preventDefault(); openPal(); }
    else if (e.key === 'Escape') select(null);
    else if (e.key === 'f') doFit();
    else if (e.key === 'g' && gapsBtn) gapsBtn.click();
    else if (/^[0-3]$/.test(e.key) && depth) { depth.value = e.key; depth.dispatchEvent(new Event('input')); }
    else if (e.key.indexOf('Arrow') === 0 && S.sel) { e.preventDefault(); walk(e.key); }
    else if (spec.key) spec.key(e, H);
  });

  function walk(key) {
    var want = { ArrowUp:-Math.PI / 2, ArrowRight:0, ArrowDown:Math.PI / 2, ArrowLeft:Math.PI }[key];
    var best = null, bs = Infinity;
    adj[S.sel.id].forEach(function (l) {
      if (!visible[l.node.id]) return;
      var a = Math.atan2(l.node.y - S.sel.y, l.node.x - S.sel.x);
      var d = Math.abs(Math.atan2(Math.sin(a - want), Math.cos(a - want)));
      if (d < bs) { bs = d; best = l.node; }
    });
    if (best && bs < 1.3) select(best);
  }

  /* ── cue ───────────────────────────────────────────────────────────── */
  var cue = document.getElementById('cue'), cued = false;
  function retireCue() {
    if (cued || !cue) return;
    cued = true;
    cue.classList.add('gone');
    setTimeout(function () { if (cue.parentNode) cue.remove(); }, 700);
  }
  setTimeout(retireCue, 11000);

  /* ── go ────────────────────────────────────────────────────────────── */
  var nN = document.getElementById('n-nodes'), nE = document.getElementById('n-edges'),
      nG = document.getElementById('n-gaps');
  if (nN) nN.textContent = nodes.length;
  if (nE) nE.textContent = edges.length;
  if (nG) nG.textContent = nodes.filter(function (n) { return n.state === 'gap'; }).length;

  relayout();
  nodes.forEach(function (n) { if (!n.pinned) { n.x = n.tx; n.y = n.ty; } });
  if (spec.init) spec.init(H); else fit();
  loop();

  window.ESTATE = H;
  return H;
};
</script>
<script>/* ══ VARIATION · STRATA ════════════════════════════════════════════════════
   The estate sorted by how hard it is to change. Four bands, hardest at the
   top: Principles · Standard Operating Procedure · Suggestions · Conventions,
   with everything that is an actor rather than a rule laid below the line.

   The other five readings answer "what is this, and what does it touch?"
   This one answers the question an auditor actually asks: "if we disagree
   with this, can we override it — and who says so?"

   Vertical position is authority. An edge that climbs the page is a thing
   deferring to something it cannot argue with; an edge that descends is
   authority being applied. Same 112 nodes, ranked instead of arranged.

   Colour here is the Engineering Ledger direction from moodboard.html —
   ledger paper, oxide, slate, marginalia — because a hierarchy of authority
   is a document, not a diagram.
─────────────────────────────────────────────────────────────────────────── */

(function () {
  var PAPER = window.__THEME.css.ledgerPaper, RULE = window.__THEME.css.ledgerRule, MARG = window.__THEME.css.ledgerMarg;
  // narrow enough that a band's heading and its marginalia both clear the HUD
  var PER_ROW = 5, XGAP = 150, YGAP = 64, HEAD = 100, PAD = 26, LABEL_LINE = 10.5;
  var ORDER = ['kpi', 'principle', 'entity', 'fn', 'cause'];

  var band = {};        // rank → { y0, y1, rows, count }
  var placed = {};      // id  → rank, for the render pass

  function wrapLabel(ctx, label, maxWidth) {
    var words = label.toUpperCase().split(/\s+/), lines = [], line = '';
    words.forEach(function (word) {
      var candidate = line ? line + ' ' + word : word;
      if (line && ctx.measureText(candidate).width > maxWidth) {
        lines.push(line);
        line = word;
      } else {
        line = candidate;
      }
    });
    if (line) lines.push(line);
    return lines;
  }

  function rankSort(a, b) {
    var d = ORDER.indexOf(a.type) - ORDER.indexOf(b.type);
    if (d) return d;
    if (a.ring !== b.ring) return a.ring - b.ring;
    return a.clock - b.clock;
  }

  var REL_TEXT = ['segments', 'moves', 'breaks at', 'caused by'];
  var linkCount = {}, reachSet = {}, reach = {}, pathCount = {}, GUT = 0;

  /* "Where to start": root causes ranked by the KPIs they reach */
  function buildStart(H) {
    var box = document.getElementById('start');
    if (!box) return;
    var causes = H.nodes.filter(function (n) { return n.type === 'cause'; }).sort(function (a, b) {
      return (reach[b.id] - reach[a.id]) || ((pathCount[b.id] || 0) - (pathCount[a.id] || 0)) || a.label.localeCompare(b.label);
    });
    var list = box.querySelector('.chips');
    causes.forEach(function (n) {
      var b = document.createElement('button');
      b.className = 'chip'; b.type = 'button';
      b.setAttribute('data-id', n.id);
      var dot = document.createElement('i'); dot.className = 'cd';
      dot.style.setProperty('--c', n.color);
      var nm = document.createElement('span'); nm.textContent = n.label;
      var ct = document.createElement('em'); ct.textContent = reach[n.id] + (reach[n.id] === 1 ? ' tower' : ' towers');
      b.appendChild(dot); b.appendChild(nm); b.appendChild(ct);
      b.addEventListener('mouseenter', function () { H.hover(n); });
      b.addEventListener('mouseleave', function () { H.hover(null); });
      b.addEventListener('focus', function () { H.hover(n); });
      b.addEventListener('blur', function () { H.hover(null); });
      b.addEventListener('click', function () { H.select(n); });
      list.appendChild(b);
    });
    window.__startFit = null;
    var sel = null;
    window.__startMark = function (n) {
      Array.prototype.forEach.call(list.children, function (c) { c.classList.toggle('on', !!n && c.getAttribute('data-id') === n.id); });
    };
  }

  /* ── KPI picker: which KPIs (and so which paths and downstream nodes) are on screen ── */
  var KPI_IDS = window.GRAPH.nodes.filter(function (n) { return n[2] === 'kpi'; }).map(function (n) { return n[0]; });
  var kpiOn = {}, allowed = {}, edgeOn = {};
  var DEFAULT_KPIS = ['t_p2p', 't_sc'];   // P2P and SC share the KSM-17 root cause
  KPI_IDS.forEach(function (id) { kpiOn[id] = DEFAULT_KPIS.indexOf(id) >= 0; });
  function livePathList() { return window.GRAPH.paths.filter(function (p) { return kpiOn[p[0]]; }); }
  function recalcAllowed() {
    allowed = {}; edgeOn = {};
    livePathList().forEach(function (p) {
      p.forEach(function (id, i) { allowed[id] = 1; if (i) edgeOn[p[i - 1] + '>' + id] = 1; });
    });
  }
  recalcAllowed();

  function buildKpiMenu(H) {
    var wrap = document.getElementById('kpi-menu');
    if (!wrap) return;
    var btn = wrap.querySelector('.km-btn'), pop = wrap.querySelector('.km-pop'), list = wrap.querySelector('.km-list');
    var all = wrap.querySelector('[data-act="all"]'), none = wrap.querySelector('[data-act="none"]');
    var boxes = {};
    function count() { return KPI_IDS.filter(function (id) { return kpiOn[id]; }).length; }
    function refresh() {
      btn.querySelector('.km-n').textContent = count() + ' / ' + KPI_IDS.length;
      KPI_IDS.forEach(function (id) { boxes[id].checked = !!kpiOn[id]; });
      recalcAllowed();
      var chips = document.querySelectorAll('#start .chip');
      Array.prototype.forEach.call(chips, function (c) { c.style.display = allowed[c.getAttribute('data-id')] ? '' : 'none'; });
      if (H.S.sel && !allowed[H.S.sel.id]) H.select(null);
      H.hover(null);
      H.relayout();
    }
    KPI_IDS.forEach(function (id) {
      var n = H.byId[id];
      var row = document.createElement('label'); row.className = 'km-row';
      var cb = document.createElement('input'); cb.type = 'checkbox'; boxes[id] = cb;
      cb.addEventListener('change', function () { kpiOn[id] = cb.checked; refresh(); });
      var nm = document.createElement('span'); nm.className = 'km-nm'; nm.textContent = n.label;
      var dot = document.createElement('i'); dot.style.background = n.color;
      row.appendChild(cb); row.appendChild(dot); row.appendChild(nm);
      list.appendChild(row);
    });
    all.addEventListener('click', function () { KPI_IDS.forEach(function (id) { kpiOn[id] = true; }); refresh(); });
    none.addEventListener('click', function () { KPI_IDS.forEach(function (id) { kpiOn[id] = false; }); refresh(); });
    function close() { pop.hidden = true; btn.setAttribute('aria-expanded', 'false'); }
    btn.addEventListener('click', function (e) { e.stopPropagation(); pop.hidden = !pop.hidden; btn.setAttribute('aria-expanded', String(!pop.hidden)); });
    pop.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !pop.hidden) { close(); e.stopPropagation(); } }, true);
    refresh();
  }

  window.Explore({
    id:'strata-rca',
    fitPad:300,
    drag:false,
    pan:false,
    zoom:false,
    spring:false,
    filter:function (n) { return !!allowed[n.id]; },
    paths:livePathList,
    onSelect:function (n) {
      var st = document.getElementById('start');
      if (st) st.classList.toggle('shift', !!n);
      if (window.__startMark) window.__startMark(n);
    },
    panToSelection:false,
    relayoutOnSelection:false,
    hint:'Top band is where we look.<br>Bottom band is why it happens; open a root cause to decide.',

    frame:function (H) {
      /* screen space == world space: no zoom, no pan, nothing leaves the window */
      H.S.cam.k = 1; H.S.cam.x = 0; H.S.cam.y = H.H / 2;
    },

    init:function (H) {
      var P = window.GRAPH.paths || [];
      /* paths per link, KPIs reached per cause, paths per cause */
      P.forEach(function (p) {
        for (var i = 1; i < p.length; i++) { var k = p[i - 1] + '>' + p[i]; linkCount[k] = (linkCount[k] || 0) + 1; }
        var c = p[p.length - 1];
        (reachSet[c] = reachSet[c] || {})[p[0]] = 1;
        pathCount[c] = (pathCount[c] || 0) + 1;
      });
      H.nodes.forEach(function (n) {
        if (n.type !== 'cause') return;
        reach[n.id] = Object.keys(reachSet[n.id] || {}).length;
        n.r = 7 + Math.max(0, reach[n.id] - 1) * 2.4;          // bigger red node = larger impact if fixed
      });
      buildStart(H);
      buildKpiMenu(H);
      H.relayout();            // chip rows now have a height; bands start below them
      H.doFit();
    },

    place:function (H) {
      var tiers = H.tiers.slice().sort(function (a, b) { return (a.n || 99) - (b.n || 99); });
      placed = {}; band = {};
      var sb = document.getElementById('start');
      var top = 108, bottom = 14, side = 24;
      if (sb && getComputedStyle(sb).display !== 'none') top = Math.max(108, Math.ceil(sb.getBoundingClientRect().bottom) + 8);
      var TW = Math.max(150, Math.min(214, H.W * 0.17));     // title gutter width
      var sc = TW / 214;                                      // title font scale
      var bandH = Math.max(100, (H.H - top - bottom) / tiers.length);
      var y = top;
      tiers.forEach(function (t) {
        var mine = H.nodes.filter(function (n) { return n.rank === t.n && H.visible[n.id]; }).sort(rankSort);
        var availW = H.W - TW - side;
        var step = Math.min(availW / Math.max(1, mine.length), 150);   // few nodes stay close together
        var x0 = -H.W / 2 + TW + (availW - step * mine.length) / 2;
        band[t.n] = { y0:y, y1:y + bandH, count:mine.length, tier:t, step:step, sc:sc, TW:TW };
        mine.forEach(function (n, i) {
          placed[n.id] = t.n;
          n.pinned = false;
          n.tx = x0 + (i + 0.5) * step;
          n.ty = y + 34;
        });
        y += bandH;
      });
    },

    render:function (ctx, H) {
      var S = H.S;
      var left = 10, right = H.W - 10;
      var narrow = H.W < 760;                       // under 760px only the structure is drawn

      /* slide on select: same scale, tree moves left so the selected paths clear the side panel */
      var target = 0;
      if (S.sel && window.innerWidth > 900) {
        var panelW = Math.min(560, window.innerWidth * 0.46), limit = H.W - panelW - 18;
        var xmax = -1e9, xmin = 1e9;
        H.paths().forEach(function (pp) {
          if (pp.indexOf(S.sel.id) < 0) return;
          pp.forEach(function (id) {
            var m = H.byId[id]; if (!m) return;
            var bx = m.x + H.W / 2, hs = (band[m.rank] ? band[m.rank].step : 100) / 2;
            xmax = Math.max(xmax, bx + hs); xmin = Math.min(xmin, bx - hs);
          });
        });
        var room = Math.max(0, xmin - (GUT + 8));
        target = Math.max(0, Math.min(xmax - limit, room));
      }
      var dx = target - S.cam.x;
      S.cam.x = Math.abs(dx) < 0.4 ? target : S.cam.x + dx * 0.2;

      /* ── the bands ─────────────────────────────────────────────────── */
      Object.keys(band).forEach(function (k) {
        var b = band[k], t = b.tier;
        var y0 = H.sy(b.y0), y1 = H.sy(b.y1);
        var dim = S.onR[t.n] === false;

        ctx.fillStyle = H.hexA(t.color, dim ? 0.015 : 0.045);
        ctx.fillRect(left, y0, right - left, y1 - y0);

        // the top rule carries the weight: solid and thick for a principle,
        // hairline and broken by the time you reach a convention
        ctx.beginPath();
        ctx.moveTo(left, y0); ctx.lineTo(right, y0);
        if (t.n === 0) ctx.setLineDash([2, 6]);
        else if (t.n === 5) ctx.setLineDash([9, 4]);
        ctx.strokeStyle = H.hexA(t.color, dim ? 0.22 : 0.72);
        ctx.lineWidth = t.n === 1 ? 2.4 : t.n === 2 ? 1.6 : 1;
        ctx.stroke();
        ctx.setLineDash([]);

        var a = dim ? 0.3 : 1;

        // Keep the rank inside the band so the composition stays centered.
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        H.sans(30 * b.sc, 700);
        ctx.fillStyle = H.hexA(t.color, a * (t.n === 0 ? 0.3 : 0.9));
        ctx.fillText(t.n ? String(t.n) : '—', left + 14, y0 + 16);

        H.sans(16 * b.sc, 700);
        ctx.fillStyle = H.hexA(t.n === 0 ? MARG : PAPER, a * 0.92);
        ctx.fillText(t.label, left + 14 + 34 * b.sc, y0 + 16);

        H.tracked(9 * b.sc, 1.9 * b.sc);
        ctx.fillStyle = H.hexA(t.color, a * 0.85);
        ctx.fillText(t.edit.toUpperCase(), left + 14 + 34 * b.sc, y0 + 16 + 26 * b.sc);
        H.clearTrack();

      });

      /* the relation between layers, once, in the left column */
      Object.keys(band).forEach(function (k) {
        var b = band[k], n = +k;
        GUT = b.TW - 2;
        if (n < 1 || n > 4 || narrow) return;
        H.tracked(9 * b.sc, 1.2 * b.sc);
        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillStyle = H.hexA(MARG, S.onR[n] === false ? 0.3 : 1);
        ctx.fillText('↓ ' + REL_TEXT[n - 1], left + 14, H.sy(b.y1) - 10);
        H.clearTrack();
      });

      /* tree content slides behind the left column, never over the layer names */
      ctx.save();
      ctx.beginPath(); ctx.rect(GUT, 0, H.W - GUT, H.H); ctx.clip();

      /* ── label layout (needed first so edges can start below the text) ── */
      H.nodes.forEach(function (n) {
        var bd = band[n.rank];
        if (!bd || placed[n.id] === undefined) { n._lb = null; return; }
        var r = Math.max(3.6, n.r * 0.7);
        var fs = Math.max(6, Math.min(8.5, bd.step / 12.5));
        H.tracked(fs, 0.7);
        var lines = narrow ? [] : wrapLabel(ctx, n.label, bd.step - 8);
        H.clearTrack();
        var extra = null;
        if (!narrow) {
          if ((n.type === 'kpi' || n.type === 'entity') && n.sub) extra = { text:n.sub, color:PAPER, weight:700 };
          else if (n.type === 'cause' && reach[n.id]) extra = { text:('Reaches ' + reach[n.id] + (reach[n.id] === 1 ? ' tower' : ' towers')).toUpperCase(), color:n.color, weight:700 };
        }
        n._ll = { lines:lines, fs:fs, lh:fs * 1.3, r:r, extra:extra };
        n._lb = H.sy(n.y) + r + 8 + (lines.length + (extra ? 1 : 0)) * fs * 1.3;       // bottom of the label
        if (narrow) n._lb = H.sy(n.y) + r + 4;
      });
      var chTop = {};
      H.nodes.forEach(function (n) {
        if (n._lb == null) return;
        chTop[n.rank] = Math.max(chTop[n.rank] || 0, n._lb + 6);
      });

      /* ── edges: drop from the label, run along the gap, drop into the node ── */
      var act = S.hover || S.sel;
      var pairs = {};
      var list = [];
      var tags = [];
      H.edges.forEach(function (e) {
        if (!H.visible[e.a.id] || !H.visible[e.b.id]) return;
        var ra = placed[e.a.id], rb = placed[e.b.id];
        if (ra === undefined || rb === undefined) return;
        if (!edgeOn[e.a.id + '>' + e.b.id]) return;          // only links on a selected KPI's paths
        var up = e.a.y <= e.b.y ? e.a : e.b, dn = up === e.a ? e.b : e.a;
        var item = { e:e, up:up, dn:dn, ra:ra, rb:rb };
        list.push(item);
        (pairs[up.rank] = pairs[up.rank] || []).push(item);
      });
      Object.keys(pairs).forEach(function (k) {
        var g = pairs[k];
        g.sort(function (p, q) { return (p.up.x - q.up.x) || (p.dn.x - q.dn.x); });
        var L = Math.min(g.length, 6);
        g.forEach(function (it, i) { it.lane = i % L; it.lanes = L; });
      });
      // draw faint edges first, lit edges last so they sit on top
      list.sort(function (p, q) {
        var tp = act && H.focusEdge && H.focusEdge[p.e.a.id + '>' + p.e.b.id] ? 1 : 0;
        var tq = act && H.focusEdge && H.focusEdge[q.e.a.id + '>' + q.e.b.id] ? 1 : 0;
        return tp - tq;
      });
      list.forEach(function (it) {
        var e = it.e, ra = it.ra, rb = it.rb;
        var touches = act && H.focusEdge && H.focusEdge[e.a.id + '>' + e.b.id];
        var crosses = ra !== rb && ra !== 0 && rb !== 0;
        var al = !H.focus ? 0.5 : (touches ? 0.95 : 0.03);
        if (al < 0.02) return;
        var hard = H.tierOf[Math.min(ra || 9, rb || 9)];
        var col = touches ? e.a.color : (crosses && hard ? hard.color : RULE);

        var up = it.up, dn = it.dn;
        var xu = H.sx(up.x), xd = H.sx(dn.x);
        var ys = (up._lb != null ? up._lb : H.sy(up.y) + 12) + 2;
        var rd = (dn._ll ? dn._ll.r : 5) + 3.4;
        var ye = H.sy(dn.y) - rd - 2;
        var bd = band[dn.rank];
        var yc = Math.min(chTop[up.rank] || ys, ye - 8);        // clear of every label in the upper band
        var f = it.lanes > 1 ? 0.3 + 0.4 * (it.lane / (it.lanes - 1)) : 0.5;
        var cy = yc + (ye - yc) * f;

        ctx.beginPath();
        ctx.moveTo(xu, ys);
        if (Math.abs(xd - xu) < 1.5) {
          ctx.lineTo(xd, ye);
        } else {
          ctx.lineTo(xu, yc);
          ctx.bezierCurveTo(xu, cy, xd, cy, xd, ye);
        }
        var cnt = linkCount[e.a.id + '>' + e.b.id] || 1;
        ctx.strokeStyle = H.hexA(col, al);
        ctx.lineWidth = Math.max(1.1, 0.6 * cnt + 0.5) + (touches ? 0.6 : 0);   // about 0.6px per RCA path
        ctx.stroke();
        if (touches && act && !narrow && Math.abs(xd - xu) >= 1.5) {
          var N = 0;
          H.paths().forEach(function (pp) {
            var i = pp.indexOf(e.a.id);
            if (pp.indexOf(act.id) >= 0 && i >= 0 && pp[i + 1] === e.b.id) N++;
          });
          if (N > 1) tags.push({ x:(xu + xd) / 2, y:0.125 * (yc + ye) + 0.75 * cy, n:N, col:col });
        }
        if (touches && act && !narrow && Math.abs(xd - xu) < 1.5) {
          var N2 = 0;
          H.paths().forEach(function (pp) {
            var i2 = pp.indexOf(e.a.id);
            if (pp.indexOf(act.id) >= 0 && i2 >= 0 && pp[i2 + 1] === e.b.id) N2++;
          });
          if (N2 > 1) tags.push({ x:xu, y:(yc + ye) / 2, n:N2, col:col });
        }
      });

      /* ×N: how many of the active node's paths use this link (hidden when 1) */
      tags.forEach(function (t) {
        var txt = '×' + t.n;
        H.sans(10, 700);
        var w = ctx.measureText(txt).width + 10;
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(t.x - w / 2, t.y - 8, w, 16);
        ctx.strokeStyle = t.col; ctx.lineWidth = 1;
        ctx.strokeRect(t.x - w / 2 + 0.5, t.y - 8 + 0.5, w - 1, 15);
        ctx.fillStyle = PAPER; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(txt, t.x, t.y + 0.5);
      });

      /* ── nodes: type in the core, stratum in the ring ──────────────── */
      H.nodes.forEach(function (n) {
        var al = H.alphaOf(n);
        if (al <= 0 || placed[n.id] === undefined) return;
        var t = H.tierOf[n.rank];
        var x = H.sx(n.x), y = H.sy(n.y);
        var r = Math.max(3.6, n.r * 0.7) * Math.max(0.72, Math.min(1.5, S.cam.k));
        var active = (n === S.hover || n === S.sel);
        var lit = active || (H.focus && H.focus[n.id]);

        if (active) {
          ctx.beginPath(); ctx.arc(x, y, r + 9, 0, Math.PI * 2);
          ctx.strokeStyle = H.hexA(t ? t.color : n.color, 0.5);
          ctx.lineWidth = 1; ctx.stroke();
        }

        // the stratum ring — solid for a principle, dashed by the time it is habit
        if (t) {
          ctx.beginPath(); ctx.arc(x, y, r + 3.4, 0, Math.PI * 2);
          if (n.state === 'ctx' || n.state === 'gap') ctx.setLineDash([5, 3]);
          ctx.strokeStyle = H.hexA(t.color, al * (n.rank === 1 ? 0.95 : n.rank === 0 ? 0.3 : 0.55));
          ctx.lineWidth = n.rank === 1 ? 1.9 : 1.1;
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
        if (n.type === 'cause') {
          if (lit) { ctx.shadowColor = H.hexA(n.color, 0.8); ctx.shadowBlur = 11; }
          ctx.fillStyle = H.hexA(n.color, al); ctx.fill(); ctx.shadowBlur = 0;
        } else if (n.state === 'ctx') {
          ctx.strokeStyle = H.hexA(n.color, al * 0.9); ctx.lineWidth = 1.3; ctx.stroke();
        } else {
          if (lit) { ctx.shadowColor = H.hexA(n.color, 0.8); ctx.shadowBlur = 11; }
          ctx.fillStyle = H.hexA(n.color, al); ctx.fill(); ctx.shadowBlur = 0;
        }

        var LL = n._ll;
        H.tracked(LL.fs, 0.7);
        ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        ctx.fillStyle = H.hexA(PAPER, active ? 1 : Math.min(al, 0.78));
        LL.lines.forEach(function (line, i) {
          ctx.fillText(line, x, y + r + 8 + i * LL.lh);
        });
        if (LL.extra) {
          H.tracked(LL.fs, LL.extra.weight === 700 && n.type === 'cause' ? 0.7 : 0.2, LL.extra.weight);
          ctx.fillStyle = H.hexA(LL.extra.color, active ? 1 : Math.min(al, 0.95));
          ctx.fillText(LL.extra.text, x, y + r + 8 + LL.lines.length * LL.lh + 1);
        }
        H.clearTrack();
      });
      ctx.restore();
    },
  });
})();
</script>
